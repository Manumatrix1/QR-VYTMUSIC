<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VYT IA</title>
<meta name="theme-color" content="#030712">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VYT IA">
<link rel="apple-touch-icon" href="/logo-vyt-panel.png">
<link rel="manifest" href="/panel-manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--bg:#030712;--bg2:#0a0f1e;--bg3:#0f172a;--card:#111827;--border:#1f2937;--text:#f1f5f9;--muted:#6b7280;--cyan:#06b6d4;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden;}
#app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;}

/* HEADER */
#hdr{background:linear-gradient(135deg,#0a1628,#0d2040);padding:calc(var(--safe-top) + 12px) 16px 12px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
#hdr img{width:38px;height:38px;border-radius:10px;object-fit:contain;}
#hdr-title{flex:1;}
#hdr-title strong{display:block;font-size:18px;font-weight:900;letter-spacing:-.5px;}
#hdr-title span{font-size:11px;color:var(--cyan);}
#hdr-status{display:flex;align-items:center;gap:5px;font-size:11px;color:#4ade80;}
#hdr-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* CONTENT */
#content{flex:1;overflow:hidden;position:relative;}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;}
.screen.active{display:block;}

/* BOTTOM NAV */
#nav{background:#060d1a;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:var(--safe-bot);flex-shrink:0;}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border:none;background:none;color:var(--muted);cursor:pointer;transition:color .15s;font-size:10px;font-weight:600;letter-spacing:.3px;}
.nav-btn svg{width:24px;height:24px;}
.nav-btn.active{color:var(--cyan);}
.nav-btn.active .nav-ind{display:block;}
.nav-ind{display:none;width:24px;height:2px;border-radius:2px;background:var(--cyan);margin-top:-2px;}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;}
.label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:4px;}
.big-num{font-size:44px;font-weight:900;line-height:1;}

/* CHIPS */
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;border:1px solid;}
.chip-blue{background:#1e3a5f;color:#93c5fd;border-color:#2563eb40;}
.chip-purple{background:#2d1b69;color:#c4b5fd;border-color:#7c3aed40;}
.chip-teal{background:#0d3a3a;color:#5eead4;border-color:#0d948840;}
/* Source chips */
.chip-pres{background:#1a2f1a;color:#86efac;border-color:#16a34a40;}
.chip-onl{background:#1a1a2f;color:#a5b4fc;border-color:#6366f140;}
.chip-wa{background:#1a2a1a;color:#4ade80;border-color:#22c55e40;}
/* Source tabs en editor */
.src-tab{flex:1;padding:10px 6px;border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;background:var(--bg3);color:var(--muted);transition:all .15s;}
.src-tab.on{background:var(--cyan);color:#000;}

/* LEAD LIST */
.lead-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;}
.lead-item:active{background:var(--card);}
.lead-avatar{width:42px;height:42px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:var(--cyan);flex-shrink:0;}
.lead-info{flex:1;min-width:0;}
.lead-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lead-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.lead-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}

/* SEARCH */
.search-wrap{position:relative;}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:var(--muted);}
.search-wrap input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:9px 12px 9px 36px;color:var(--text);font-size:14px;outline:none;}
.search-wrap input:focus{border-color:var(--cyan);}
.search-wrap input::placeholder{color:var(--muted);}

/* FILTER PILLS */
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.pills::-webkit-scrollbar{display:none;}
.pill{border:none;background:var(--bg3);color:var(--muted);font-size:12px;font-weight:700;padding:6px 14px;border-radius:20px;white-space:nowrap;cursor:pointer;}
.pill.on{background:var(--cyan);color:#000;}

/* CHAT BUBBLES */
.bubble-wrap{display:flex;}
.bubble-wrap.usr{justify-content:flex-end;}
.bubble{max-width:78%;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.5;}
.bubble.bot{background:var(--bg3);color:var(--text);border-radius:4px 16px 16px 16px;}
.bubble.usr{background:linear-gradient(135deg,#0072ff,#00c6ff);color:#fff;border-radius:16px 4px 16px 16px;}
.bubble-role{font-size:10px;opacity:.5;margin-bottom:3px;}

/* PROMPT EDITOR */
#prompt-ta{width:100%;flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:14px;color:var(--text);font-size:13px;font-family:monospace;line-height:1.6;resize:none;outline:none;-webkit-overflow-scrolling:touch;}
#prompt-ta:focus{border-color:var(--cyan);}

/* BUTTONS */
.btn-pri{width:100%;padding:14px;border:none;border-radius:14px;background:var(--cyan);color:#000;font-size:15px;font-weight:900;cursor:pointer;transition:opacity .15s;}
.btn-pri:active{opacity:.8;}
.btn-pri:disabled{background:var(--bg3);color:var(--muted);cursor:not-allowed;}
.btn-sec{width:100%;padding:14px;border:1px solid var(--border);border-radius:14px;background:none;color:var(--muted);font-size:15px;font-weight:700;cursor:pointer;}

/* SPINNER */
.spin{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--cyan);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg)}}

/* BACK BUTTON */
.back-btn{display:flex;align-items:center;gap:6px;color:var(--cyan);font-size:14px;background:none;border:none;cursor:pointer;padding:0;margin-bottom:12px;}
.back-btn svg{width:18px;height:18px;fill:var(--cyan);}

/* QUICK ACTIONS */
.qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.qa-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;text-align:left;border-width:1px;transition:border-color .15s;}
.qa-card:active{border-color:var(--cyan);}
.qa-icon{font-size:24px;margin-bottom:6px;}
.qa-title{font-size:13px;font-weight:700;color:var(--text);}
.qa-sub{font-size:11px;color:var(--muted);margin-top:2px;}
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div id="hdr">
    <img src="/logo-vyt-panel.png" alt="VYT">
    <div id="hdr-title">
      <strong>VYT IA</strong>
      <span>Panel de control</span>
    </div>
    <div id="hdr-status">
      <span id="hdr-dot"></span>
      <span>En línea</span>
    </div>
  </div>

  <!-- CONTENT -->
  <div id="content">

    <!-- ── INICIO ── -->
    <div id="s-inicio" class="screen active">
      <div style="padding:16px;display:flex;flex-direction:column;gap:12px;">

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div class="card" style="grid-column:span 2">
            <div class="label">Total consultas</div>
            <div class="big-num" id="st-total">—</div>
            <div style="font-size:12px;color:var(--muted);margin-top:4px;">personas que usaron el chat</div>
          </div>
          <div class="card" style="background:#0d1f3c;border-color:#1e3a5f;">
            <div class="label" style="color:#60a5fa;">Presencial</div>
            <div class="big-num" style="font-size:32px;" id="st-pres">—</div>
            <div style="font-size:11px;color:#3b82f6;margin-top:4px;">Rosario</div>
          </div>
          <div class="card" style="background:#1a0d3c;border-color:#3b1f69;">
            <div class="label" style="color:#a78bfa;">Online</div>
            <div class="big-num" style="font-size:32px;" id="st-onl">—</div>
            <div style="font-size:11px;color:#7c3aed;margin-top:4px;">Todo el país</div>
          </div>
        </div>

        <div class="qa-grid">
          <button class="qa-card" onclick="goTab('leads')">
            <div class="qa-icon">👥</div>
            <div class="qa-title">Ver leads</div>
            <div class="qa-sub">Registro completo</div>
          </button>
          <button class="qa-card" onclick="goTab('ia')">
            <div class="qa-icon">🤖</div>
            <div class="qa-title">Editor IA</div>
            <div class="qa-sub">Cambiar respuestas</div>
          </button>
        </div>

        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <span style="font-size:13px;font-weight:700;color:#cbd5e1;">Últimas consultas</span>
            <button onclick="goTab('leads')" style="font-size:12px;color:var(--cyan);background:none;border:none;cursor:pointer;">Ver todas →</button>
          </div>
          <div id="st-recientes"><div style="text-align:center;padding:20px;"><div class="spin"></div></div></div>
        </div>

      </div>
    </div>

    <!-- ── LEADS ── -->
    <div id="s-leads" class="screen">
      <!-- Lista de leads -->
      <div id="leads-list-view">
        <div style="padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input id="search-inp" type="text" placeholder="Buscar nombre, teléfono, ciudad..." oninput="renderLeads()">
          </div>
          <div class="pills" style="margin-top:10px;" id="filter-pills">
            <button class="pill on" data-f="todos" onclick="setFilter('todos')">Todos</button>
            <button class="pill" data-f="presencial" onclick="setFilter('presencial')">Presencial</button>
            <button class="pill" data-f="online" onclick="setFilter('online')">Online</button>
            <button class="pill" data-f="ambos" onclick="setFilter('ambos')">Ambos</button>
          </div>
        </div>
        <div id="leads-list"></div>
      </div>

      <!-- Detalle de lead -->
      <div id="leads-detail-view" style="display:none;height:100%;display:none;flex-direction:column;">
        <div style="padding:16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;">
          <button class="back-btn" onclick="closeLead()">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            Volver
          </button>
          <div id="lead-detail-header"></div>
        </div>
        <div id="lead-msgs" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;"></div>
      </div>
    </div>

    <!-- ── EDITOR IA ── -->
    <div id="s-ia" class="screen">
      <div style="padding:16px;height:100%;display:flex;flex-direction:column;gap:10px;box-sizing:border-box;">

        <!-- Selector de fuente -->
        <div>
          <p style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;">Editar respuestas para:</p>
          <div style="display:flex;gap:6px;">
            <button class="src-tab on" data-src="presencial" onclick="switchSrc('presencial')">🎤 Presencial</button>
            <button class="src-tab" data-src="online" onclick="switchSrc('online')">🌐 Online</button>
            <button class="src-tab" data-src="whatsapp" onclick="switchSrc('whatsapp')">💬 WhatsApp</button>
          </div>
        </div>

        <div style="background:#0c1f2e;border:1px solid #0e4f6a;border-radius:12px;padding:10px;">
          <p style="font-size:11px;color:#7dd3fc;line-height:1.5;" id="ia-hint">
            <strong>Presencial (Rosario):</strong> Instrucciones para personas que consultan desde la página del certamen de Rosario.
          </p>
        </div>

        <textarea id="prompt-ta" placeholder="Escribí las instrucciones para esta fuente..."></textarea>

        <div style="font-size:11px;color:var(--muted);text-align:right;" id="prompt-chars">0 caracteres</div>

        <div style="display:flex;gap:10px;">
          <button class="btn-sec" id="btn-discard" onclick="discardPrompt()" style="display:none;">Descartar</button>
          <button class="btn-pri" id="btn-save" onclick="savePrompt()">Guardar cambios</button>
        </div>
        <div id="prompt-status" style="text-align:center;font-size:13px;min-height:20px;"></div>

      </div>
    </div>

  </div>

  <!-- BOTTOM NAV -->
  <div id="nav">
    <button class="nav-btn active" data-tab="inicio" onclick="goTab('inicio')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Inicio
      <span class="nav-ind"></span>
    </button>
    <button class="nav-btn" data-tab="leads" onclick="goTab('leads')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      Leads
      <span class="nav-ind"></span>
    </button>
    <button class="nav-btn" data-tab="ia" onclick="goTab('ia')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
      Editor IA
      <span class="nav-ind"></span>
    </button>
  </div>
</div>

<script type="module">
import { db } from './firebase_config.js';
import {
  collection, doc, getDoc, getDocs, setDoc, query, orderBy,
  onSnapshot, serverTimestamp
} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

// ── Estado global ──────────────────────────────────────────────
var allLeads   = [];
var activeFilter = 'todos';
var promptOrig = '';

const TIPO_CHIP = {
  presencial: '<span class="chip chip-blue">Presencial</span>',
  online:     '<span class="chip chip-purple">Online</span>',
  ambos:      '<span class="chip chip-teal">Ambos</span>',
};
const SRC_CHIP = {
  presencial: '<span class="chip chip-pres">🎤 Web Rosario</span>',
  online:     '<span class="chip chip-onl">🌐 Web Online</span>',
  whatsapp:   '<span class="chip chip-wa">💬 WhatsApp</span>',
};
const SRC_HINT = {
  presencial: '<strong>Presencial (Rosario):</strong> Instrucciones para personas que consultan desde la página del certamen de Rosario.',
  online:     '<strong>Online:</strong> Instrucciones para personas interesadas en el certamen online (todo el país).',
  whatsapp:   '<strong>WhatsApp:</strong> Instrucciones para el bot de WhatsApp. El bot pide nombre y contacto en el primer mensaje automáticamente.',
};

function fmtDate(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts * 1000);
  return d.toLocaleString('es-AR', {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
}

// ── Tabs ───────────────────────────────────────────────────────
window.goTab = function(tab) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('s-' + tab).classList.add('active');
  document.querySelector('[data-tab="' + tab + '"]').classList.add('active');
  if (tab === 'leads') renderLeads();
};

// ── Leads: cargar y escuchar cambios en tiempo real ───────────
const leadsRef = collection(db, 'widget_leads');
onSnapshot(query(leadsRef, orderBy('created_at', 'desc')), snap => {
  allLeads = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  updateStats();
  renderLeads();
  renderRecentes();
});

function updateStats() {
  var total = allLeads.length;
  var pres  = allLeads.filter(l => l.certamen_tipo === 'presencial').length;
  var onl   = allLeads.filter(l => l.certamen_tipo === 'online').length;
  document.getElementById('st-total').textContent = total;
  document.getElementById('st-pres').textContent  = pres;
  document.getElementById('st-onl').textContent   = onl;
  // update pills counts
  document.querySelector('[data-f="todos"]').textContent      = 'Todos (' + total + ')';
  document.querySelector('[data-f="presencial"]').textContent = 'Presencial (' + pres + ')';
  document.querySelector('[data-f="online"]').textContent     = 'Online (' + onl + ')';
  var amb = allLeads.filter(l => l.certamen_tipo === 'ambos').length;
  document.querySelector('[data-f="ambos"]').textContent      = 'Ambos (' + amb + ')';
}

function renderRecentes() {
  var el = document.getElementById('st-recientes');
  var rec = allLeads.slice(0, 5);
  if (!rec.length) {
    el.innerHTML = '<div style="text-align:center;padding:24px;color:var(--muted);font-size:13px;">Sin consultas todavía</div>';
    return;
  }
  el.innerHTML = rec.map(l => `
    <div class="lead-item" onclick="openLead('${l.id}', true)" style="border-radius:12px;margin-bottom:6px;border:1px solid var(--border);background:var(--card);">
      <div class="lead-avatar">${l.nombre.charAt(0).toUpperCase()}</div>
      <div class="lead-info">
        <div class="lead-name">${esc(l.nombre)} ${esc(l.apellido||'')}</div>
        <div class="lead-sub">${esc(l.telefono)}${l.localidad ? ' · '+esc(l.localidad) : ''}</div>
      </div>
      <div class="lead-meta">
        ${SRC_CHIP[l.source]||TIPO_CHIP[l.certamen_tipo]||''}
        <span style="font-size:11px;color:var(--muted);">${fmtDate(l.created_at)}</span>
      </div>
    </div>
  `).join('');
}

window.setFilter = function(f) {
  activeFilter = f;
  document.querySelectorAll('#filter-pills .pill').forEach(p => p.classList.toggle('on', p.dataset.f === f));
  renderLeads();
};

window.renderLeads = function() {
  var q = (document.getElementById('search-inp').value||'').toLowerCase().trim();
  var filtered = allLeads.filter(l => {
    var matchF = activeFilter === 'todos' || l.certamen_tipo === activeFilter;
    var matchQ = !q || (l.nombre+' '+(l.apellido||'')+' '+l.telefono+' '+(l.localidad||'')).toLowerCase().includes(q);
    return matchF && matchQ;
  });
  var el = document.getElementById('leads-list');
  if (!filtered.length) {
    el.innerHTML = '<div style="text-align:center;padding:40px 20px;color:var(--muted);">😶 Sin resultados</div>';
    return;
  }
  el.innerHTML = filtered.map(l => `
    <div class="lead-item" onclick="openLead('${l.id}', false)">
      <div class="lead-avatar">${l.nombre.charAt(0).toUpperCase()}</div>
      <div class="lead-info">
        <div class="lead-name">${esc(l.nombre)} ${esc(l.apellido||'')}</div>
        <div class="lead-sub">${esc(l.telefono)}${l.localidad ? ' · '+esc(l.localidad):''}</div>
      </div>
      <div class="lead-meta">
        ${SRC_CHIP[l.source]||TIPO_CHIP[l.certamen_tipo]||''}
        <span style="font-size:11px;color:var(--muted);">${fmtDate(l.created_at)}</span>
      </div>
    </div>
  `).join('');
};

// ── Detalle de lead ────────────────────────────────────────────
window.openLead = async function(id, fromInicio) {
  if (fromInicio) goTab('leads');
  var lead = allLeads.find(l => l.id === id);
  if (!lead) return;
  document.getElementById('leads-list-view').style.display   = 'none';
  var dv = document.getElementById('leads-detail-view');
  dv.style.display = 'flex';
  document.getElementById('lead-detail-header').innerHTML = `
    <div style="font-weight:900;font-size:16px;">${esc(lead.nombre)} ${esc(lead.apellido||'')}</div>
    <div style="font-size:12px;color:var(--muted);margin-top:3px;">
      ${esc(lead.telefono)}
      ${lead.localidad ? ' · '+esc(lead.localidad) : ''}
      ${lead.edad ? ' · '+esc(lead.edad)+' años' : ''}
    </div>
    <div style="margin-top:8px;display:flex;gap:8px;align-items:center;">
      ${TIPO_CHIP[lead.certamen_tipo]||''}
      <span style="font-size:11px;color:var(--muted);">${fmtDate(lead.created_at)}</span>
    </div>
  `;
  var msgsEl = document.getElementById('lead-msgs');
  msgsEl.innerHTML = '<div style="text-align:center;padding:20px;"><div class="spin"></div></div>';
  var snap = await getDocs(collection(db, 'widget_leads', id, 'messages'));
  var msgs = snap.docs.map(d => d.data()).sort((a,b) => {
    var ta = a.created_at?.seconds||0;
    var tb = b.created_at?.seconds||0;
    return ta - tb;
  });
  if (!msgs.length) {
    msgsEl.innerHTML = '<p style="text-align:center;color:var(--muted);font-size:13px;padding:20px;">Sin mensajes guardados</p>';
    return;
  }
  msgsEl.innerHTML = msgs.map(m => `
    <div class="bubble-wrap ${m.role==='user'?'usr':''}">
      <div class="bubble ${m.role==='user'?'usr':'bot'}">
        <div class="bubble-role">${m.role==='user'?'Cliente':'IA'}</div>
        ${esc(m.content)}
      </div>
    </div>
  `).join('');
};

window.closeLead = function() {
  document.getElementById('leads-list-view').style.display   = '';
  document.getElementById('leads-detail-view').style.display = 'none';
};

// ── Editor IA (per-source) ─────────────────────────────────────
var currentSrc = 'presencial';
var promptCache = {}; // { presencial: '', online: '', whatsapp: '' }

function srcDocId(src) { return 'ia_prompt_' + src; }

async function loadPromptForSrc(src) {
  var ref = doc(db, 'config_sitio', srcDocId(src));
  try {
    var snap = await getDoc(ref);
    promptCache[src] = snap.exists() ? (snap.data().texto || '') : '';
  } catch(e) { promptCache[src] = ''; }
  if (currentSrc === src) {
    var ta = document.getElementById('prompt-ta');
    ta.value = promptCache[src];
    promptOrig = promptCache[src];
    updatePromptUI();
  }
}

window.switchSrc = function(src) {
  // Guardar valor actual en caché antes de cambiar
  promptCache[currentSrc] = document.getElementById('prompt-ta').value;
  currentSrc = src;
  // Actualizar tabs
  document.querySelectorAll('.src-tab').forEach(b => b.classList.toggle('on', b.dataset.src === src));
  // Actualizar hint
  document.getElementById('ia-hint').innerHTML = SRC_HINT[src] || '';
  // Cargar prompt de esa fuente
  if (promptCache[src] !== undefined) {
    document.getElementById('prompt-ta').value = promptCache[src];
    promptOrig = promptCache[src];
    updatePromptUI();
  } else {
    loadPromptForSrc(src);
  }
};

// Pre-cargar los 3 prompts
['presencial','online','whatsapp'].forEach(loadPromptForSrc);

document.getElementById('prompt-ta').addEventListener('input', updatePromptUI);

function updatePromptUI() {
  var ta  = document.getElementById('prompt-ta');
  var val = ta.value;
  document.getElementById('prompt-chars').textContent = val.length + ' caracteres';
  var changed = val !== promptOrig;
  document.getElementById('btn-save').disabled    = !changed;
  document.getElementById('btn-discard').style.display = changed ? '' : 'none';
  if (!changed) document.getElementById('prompt-status').textContent = '';
}

window.discardPrompt = function() {
  document.getElementById('prompt-ta').value = promptOrig;
  promptCache[currentSrc] = promptOrig;
  updatePromptUI();
};

window.savePrompt = async function() {
  var txt = document.getElementById('prompt-ta').value.trim();
  var btn = document.getElementById('btn-save');
  var st  = document.getElementById('prompt-status');
  btn.textContent = 'Guardando...';
  btn.disabled = true;
  st.textContent = '';
  try {
    var ref = doc(db, 'config_sitio', srcDocId(currentSrc));
    await setDoc(ref, { texto: txt, updated_at: serverTimestamp() }, { merge: true });
    promptOrig = txt;
    promptCache[currentSrc] = txt;
    st.textContent = '✓ Guardado para ' + currentSrc;
    st.style.color = '#4ade80';
    updatePromptUI();
    setTimeout(() => { st.textContent = ''; }, 4000);
  } catch(e) {
    st.textContent = '✗ Error: ' + e.message;
    st.style.color = '#f87171';
  }
  btn.textContent = 'Guardar cambios';
  updatePromptUI();
};

// ── Utils ──────────────────────────────────────────────────────
function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
