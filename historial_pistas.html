<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todas las Pistas | VYTMUSIC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { padding-bottom: 7rem; }
        .track-row.playing { background: rgba(99, 102, 241, 0.25); border-color: #818cf8; }
        input[type=range] { accent-color: #818cf8; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-indigo-950 to-gray-900 min-h-screen text-white">
    <div class="max-w-4xl mx-auto px-4 py-6">
        <header class="mb-5">
            <a href="eventos.html" class="text-indigo-300 hover:text-white text-sm">← Volver al inicio</a>
            <h1 class="text-3xl font-black mt-2">🎵 Todas las pistas</h1>
            <p class="text-gray-400 text-sm mt-1">Todas las pistas que los artistas subieron en todas las galas. Tocá ▶ para escuchar o ⬇ para descargar.</p>
        </header>

        <div class="bg-gray-800/70 border border-gray-700 rounded-xl p-3 mb-4 space-y-2 sticky top-0 z-20 backdrop-blur">
            <input id="buscar" type="search" placeholder="🔍 Buscar artista, canción o estilo..."
                class="w-full p-3 rounded-lg bg-gray-900 border border-gray-600 text-white focus:border-indigo-400 focus:outline-none">
            <div class="flex gap-2 items-center">
                <select id="filtroGala" class="flex-1 min-w-0 p-2 rounded-lg bg-gray-900 border border-gray-600 text-white text-sm">
                    <option value="">Todas las galas</option>
                </select>
                <span id="contador" class="text-xs text-gray-400 whitespace-nowrap"></span>
            </div>
            <button id="btnLista" class="w-full py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-sm font-bold">📋 Lista de canciones</button>
        </div>

        <div id="estado" class="text-center text-gray-400 py-12">⏳ Cargando pistas de todas las galas...</div>
        <div id="lista" class="space-y-3"></div>
    </div>

    <!-- Lista de canciones (para copiar / descargar) -->
    <div id="modalLista" class="hidden fixed inset-0 z-40 bg-black/80 flex items-center justify-center p-4">
        <div class="bg-gray-800 border border-indigo-500/50 rounded-2xl w-full max-w-lg max-h-[85vh] flex flex-col">
            <div class="p-4 border-b border-gray-700">
                <h2 class="text-xl font-bold">📋 Lista de canciones</h2>
                <p id="listaInfo" class="text-xs text-gray-400 mt-1"></p>
                <label class="flex items-center gap-2 text-sm text-gray-300 mt-2 cursor-pointer">
                    <input type="checkbox" id="listaConEstilo" checked class="accent-indigo-400"> Mostrar estilo
                </label>
            </div>
            <textarea id="listaTexto" readonly class="flex-1 min-h-[300px] m-4 p-3 rounded-lg bg-gray-900 border border-gray-600 text-sm text-gray-100 font-mono"></textarea>
            <div class="p-4 pt-0 grid grid-cols-3 gap-2">
                <button id="listaCopiar" class="py-2 rounded-lg bg-green-600 hover:bg-green-500 text-sm font-bold">📋 Copiar</button>
                <button id="listaDescargar" class="py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-sm font-bold">⬇ Descargar</button>
                <button id="listaCerrar" class="py-2 rounded-lg bg-gray-700 hover:bg-gray-600 text-sm">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Reproductor fijo abajo -->
    <div id="reproductor" class="hidden fixed bottom-0 inset-x-0 z-30 bg-gray-950/95 border-t border-indigo-500/50 backdrop-blur px-4 py-3">
        <div class="max-w-4xl mx-auto flex items-center gap-3">
            <button id="btnPlay" class="w-12 h-12 flex-shrink-0 rounded-full bg-indigo-600 hover:bg-indigo-500 text-xl">⏸</button>
            <div class="flex-1 min-w-0">
                <p id="sonandoTitulo" class="font-bold text-sm truncate"></p>
                <p id="sonandoSub" class="text-xs text-gray-400 truncate"></p>
                <div class="flex items-center gap-2 mt-1">
                    <span id="tActual" class="text-[11px] text-gray-400 font-mono w-9">0:00</span>
                    <input id="progreso" type="range" min="0" max="1000" value="0" class="flex-1 h-2">
                    <span id="tTotal" class="text-[11px] text-gray-400 font-mono w-9 text-right">0:00</span>
                </div>
            </div>
            <button id="btnCerrar" class="text-gray-400 hover:text-white text-xl px-2" title="Cerrar">✕</button>
        </div>
        <audio id="audio" preload="none"></audio>
    </div>

    <script type="module">
        import { db, auth, storage } from './firebase_config.js';
        import { collection, getDocs } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
        import { ref, getBlob } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';

        // ── Solo admin ──
        onAuthStateChanged(auth, (user) => {
            if (!user || user.isAnonymous) {
                sessionStorage.setItem('adminReturnUrl', window.location.href);
                window.location.href = 'index.html';
            }
        });

        const $ = id => document.getElementById(id);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
        const fmtTiempo = s => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '0:00';
        const fmtFecha = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: '2-digit' }) : 'sin fecha';

        let pistas = [];   // { artista, foto, cancion, estilo, url, storagePath, formato, mb, galaId, galaNombre, galaFecha, slot }
        let galas = [];

        async function cargar() {
            try {
                const evSnap = await getDocs(collection(db, 'events'));
                galas = evSnap.docs.map(d => ({ id: d.id, nombre: d.data().name || d.id, fecha: d.data().date || '' }))
                    .sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));

                const resultados = await Promise.all(galas.map(g =>
                    getDocs(collection(db, `pistas_${g.id}`))
                        .then(snap => ({ g, snap }))
                        .catch(() => ({ g, snap: null }))
                ));

                for (const { g, snap } of resultados) {
                    if (!snap) continue;
                    snap.forEach(doc => {
                        const d = doc.data();
                        (d.pistas || []).forEach(t => {
                            if (!t.archivo_url) return;
                            pistas.push({
                                artista: d.artistName || 'Artista sin nombre',
                                foto: d.artistPhoto || '',
                                cancion: t.nombre_cancion || 'Sin nombre',
                                estilo: t.estilo_cancion || '',
                                url: t.archivo_url,
                                storagePath: t.storage_path || null,
                                formato: t.formato || '',
                                mb: t.tamano_mb || '',
                                galaId: g.id, galaNombre: g.nombre, galaFecha: g.fecha,
                                slot: t.slot || 1
                            });
                        });
                    });
                }

                const conPistas = new Set(pistas.map(p => p.galaId));
                $('filtroGala').innerHTML = '<option value="">Todas las galas</option>' + galas
                    .filter(g => conPistas.has(g.id))
                    .map(g => `<option value="${g.id}">${esc(g.nombre)} (${fmtFecha(g.fecha)})</option>`).join('');

                $('estado').classList.add('hidden');
                render();
            } catch (e) {
                console.error(e);
                $('estado').textContent = '❌ No se pudieron cargar las pistas. Revisá la conexión y recargá.';
            }
        }

        function render() {
            const q = norm($('buscar').value);
            const gala = $('filtroGala').value;
            const filtradas = pistas.filter(p =>
                (!gala || p.galaId === gala) &&
                (!q || norm(`${p.artista} ${p.cancion} ${p.estilo}`).includes(q))
            );

            // Agrupar por artista (mismo nombre en distintas galas = mismo grupo)
            const grupos = new Map();
            filtradas.forEach(p => {
                const k = norm(p.artista);
                if (!grupos.has(k)) grupos.set(k, { artista: p.artista, foto: p.foto, pistas: [] });
                const g = grupos.get(k);
                if (!g.foto && p.foto) g.foto = p.foto;
                g.pistas.push(p);
            });
            const ordenados = [...grupos.values()].sort((a, b) => a.artista.localeCompare(b.artista, 'es'));

            $('contador').textContent = `${filtradas.length} pistas · ${ordenados.length} artistas`;
            if (!filtradas.length) {
                $('lista').innerHTML = `<p class="text-center text-gray-500 py-10">${pistas.length ? 'No hay pistas que coincidan con la búsqueda.' : 'Todavía no hay pistas subidas.'}</p>`;
                return;
            }

            $('lista').innerHTML = ordenados.map(g => {
                g.pistas.sort((a, b) => (b.galaFecha || '').localeCompare(a.galaFecha || '') || a.slot - b.slot);
                const avatar = g.foto
                    ? `<img src="${esc(g.foto)}" class="w-10 h-10 rounded-full object-cover border border-gray-600" onerror="this.style.display='none'">`
                    : `<div class="w-10 h-10 rounded-full bg-indigo-800 flex items-center justify-center font-bold">${esc(g.artista[0] || '?')}</div>`;
                return `
                <div class="bg-gray-800/60 border border-gray-700 rounded-xl p-3">
                    <div class="flex items-center gap-3 mb-2">
                        ${avatar}
                        <div class="min-w-0">
                            <p class="font-bold truncate">${esc(g.artista)}</p>
                            <p class="text-xs text-gray-400">${g.pistas.length} pista${g.pistas.length !== 1 ? 's' : ''}</p>
                        </div>
                    </div>
                    <div class="space-y-1.5">
                        ${g.pistas.map(p => {
                            const i = pistas.indexOf(p);
                            return `
                            <div class="track-row flex items-center gap-2 rounded-lg border border-gray-700 bg-gray-900/50 px-2 py-2" data-i="${i}">
                                <button onclick="reproducir(${i})" class="w-9 h-9 flex-shrink-0 rounded-full bg-green-600 hover:bg-green-500 text-sm" title="Escuchar">▶</button>
                                <div class="flex-1 min-w-0">
                                    <p class="text-sm font-semibold truncate">${esc(p.cancion)}${p.estilo ? ` <span class="text-gray-400 font-normal">· ${esc(p.estilo)}</span>` : ''}</p>
                                    <p class="text-[11px] text-gray-400 truncate">🎭 ${esc(p.galaNombre)} · ${fmtFecha(p.galaFecha)}${p.formato ? ` · ${esc(p.formato.toUpperCase())}` : ''}${p.mb ? ` · ${esc(p.mb)} MB` : ''}</p>
                                </div>
                                <button onclick="descargar(${i}, this)" class="w-9 h-9 flex-shrink-0 rounded-full bg-gray-700 hover:bg-gray-600 text-sm" title="Descargar">⬇</button>
                            </div>`;
                        }).join('')}
                    </div>
                </div>`;
            }).join('');
            marcarSonando();
        }

        // ── Reproductor ──
        const audio = $('audio');
        let actual = -1;

        function marcarSonando() {
            document.querySelectorAll('.track-row').forEach(el => el.classList.toggle('playing', +el.dataset.i === actual));
        }

        window.reproducir = function(i) {
            const p = pistas[i];
            if (!p) return;
            if (actual === i && !audio.paused) { audio.pause(); return; }
            if (actual !== i) {
                actual = i;
                audio.src = p.url;
                $('sonandoTitulo').textContent = `${p.artista} — ${p.cancion}`;
                $('sonandoSub').textContent = `${p.galaNombre} · ${fmtFecha(p.galaFecha)}`;
            }
            $('reproductor').classList.remove('hidden');
            audio.play().catch(err => console.warn('No se pudo reproducir:', err));
            marcarSonando();
        };

        $('btnPlay').addEventListener('click', () => { if (audio.paused) audio.play().catch(() => {}); else audio.pause(); });
        $('btnCerrar').addEventListener('click', () => {
            audio.pause(); audio.removeAttribute('src'); audio.load();
            actual = -1; marcarSonando();
            $('reproductor').classList.add('hidden');
        });
        audio.addEventListener('play', () => { $('btnPlay').textContent = '⏸'; });
        audio.addEventListener('pause', () => { $('btnPlay').textContent = '▶'; });
        audio.addEventListener('ended', () => { $('btnPlay').textContent = '▶'; });
        audio.addEventListener('timeupdate', () => {
            $('tActual').textContent = fmtTiempo(audio.currentTime);
            $('tTotal').textContent = fmtTiempo(audio.duration);
            if (audio.duration) $('progreso').value = Math.round(audio.currentTime / audio.duration * 1000);
        });
        $('progreso').addEventListener('input', e => {
            if (audio.duration) audio.currentTime = e.target.value / 1000 * audio.duration;
        });

        // ── Descarga ──
        // Los links de Firebase Storage son de otro dominio: el atributo "download" no
        // funciona con ellos. Se baja el archivo con el SDK y se descarga como blob.
        window.descargar = async function(i, btn) {
            const p = pistas[i];
            if (!p) return;
            const nombre = `${p.artista} - ${p.cancion}.${p.formato || 'mp3'}`.replace(/[\\/:*?"<>|]+/g, '');
            const original = btn.textContent;
            btn.textContent = '⏳'; btn.disabled = true;
            try {
                let path = p.storagePath;
                if (!path) { const m = p.url.match(/\/o\/(.+?)[\?&]/); path = m ? decodeURIComponent(m[1]) : null; }
                if (!path) throw new Error('sin ruta');
                const blob = await getBlob(ref(storage, path));
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = nombre;
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(a.href), 60000);
                btn.textContent = '✅';
            } catch (e) {
                console.warn('Descarga directa falló, se abre el archivo:', e);
                window.open(p.url, '_blank');
                btn.textContent = original;
            } finally {
                btn.disabled = false;
                setTimeout(() => { if (btn.textContent === '✅') btn.textContent = original; }, 3000);
            }
        };

        // ── Lista de canciones (sin repetidas, respeta el buscador y el filtro de gala) ──
        function pistasFiltradas() {
            const q = norm($('buscar').value);
            const gala = $('filtroGala').value;
            return pistas.filter(p =>
                (!gala || p.galaId === gala) &&
                (!q || norm(`${p.artista} ${p.cancion} ${p.estilo}`).includes(q)));
        }

        function armarLista() {
            const conEstilo = $('listaConEstilo').checked;
            const unicas = new Map(); // nombre normalizado → { cancion, estilo }
            pistasFiltradas().forEach(p => {
                const k = norm(p.cancion).replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ');
                if (!k) return;
                if (!unicas.has(k)) unicas.set(k, { cancion: p.cancion.trim(), estilo: p.estilo.trim() });
                else if (!unicas.get(k).estilo && p.estilo) unicas.get(k).estilo = p.estilo.trim();
            });
            const capital = t => t.charAt(0).toUpperCase() + t.slice(1);
            const lineas = [...unicas.values()]
                .sort((a, b) => a.cancion.localeCompare(b.cancion, 'es', { sensitivity: 'base' }))
                .map((c, i) => `${i + 1}. ${capital(c.cancion)}${conEstilo && c.estilo ? ` (${c.estilo})` : ''}`);
            const gala = $('filtroGala');
            const titulo = `🎵 Pistas VYT MUSIC${gala.value ? ' — ' + gala.options[gala.selectedIndex].text : ''}`;
            $('listaTexto').value = [titulo, `${lineas.length} canciones`, '', ...lineas].join('\n');
            $('listaInfo').textContent = `${lineas.length} canciones distintas (sin repetir). Usa el buscador y el filtro de gala que tengas puestos.`;
        }

        $('btnLista').addEventListener('click', () => { armarLista(); $('modalLista').classList.remove('hidden'); });
        $('listaConEstilo').addEventListener('change', armarLista);
        $('listaCerrar').addEventListener('click', () => $('modalLista').classList.add('hidden'));
        $('listaCopiar').addEventListener('click', async () => {
            const btn = $('listaCopiar');
            try { await navigator.clipboard.writeText($('listaTexto').value); }
            catch (_) { $('listaTexto').select(); document.execCommand('copy'); }
            btn.textContent = '✅ Copiada';
            setTimeout(() => { btn.textContent = '📋 Copiar'; }, 2000);
        });
        $('listaDescargar').addEventListener('click', () => {
            const blob = new Blob([$('listaTexto').value], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'Lista de pistas VYT MUSIC.txt';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 60000);
        });

        $('buscar').addEventListener('input', render);
        $('filtroGala').addEventListener('change', render);
        cargar();
    </script>
</body>
</html>
