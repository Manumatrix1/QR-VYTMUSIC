<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Escáner de Entradas - VYT MUSIC</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #fff;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
        .logo { font-size: 3.5rem; margin-bottom: 1rem; }
        .title { font-size: 1.6rem; font-weight: 900; color: #10b981; margin-bottom: 0.4rem; }
        .subtitle { color: #475569; font-size: 0.9rem; margin-bottom: 2.5rem; }
        .spinner {
            width: 52px; height: 52px;
            border: 4px solid rgba(16,185,129,0.2);
            border-top: 4px solid #10b981;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .msg { font-size: 1rem; color: #64748b; }
        .gala-name { color: #10b981; font-weight: 700; margin-top: 0.5rem; font-size: 1.1rem; }
        .error-box {
            background: #1e293b;
            border: 2px solid #ef4444;
            border-radius: 1rem;
            padding: 2rem;
            max-width: 380px;
            display: none;
        }
        .error-icon { font-size: 3rem; margin-bottom: 1rem; }
        .error-title { font-size: 1.2rem; font-weight: 700; color: #ef4444; margin-bottom: 0.75rem; }
        .error-text { color: #94a3b8; font-size: 0.9rem; line-height: 1.6; }
        .retry-btn {
            margin-top: 1.5rem;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 0.6rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }
        .retry-btn:active { opacity: 0.8; transform: scale(0.98); }

        /* Formulario de acceso (nombre + código) */
        .access-box { max-width: 360px; width: 100%; display: none; }
        .access-box input {
            width: 100%;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 0.75rem;
            padding: 0.9rem 1rem;
            color: #fff;
            font-size: 1.05rem;
            margin-bottom: 0.9rem;
            text-align: center;
        }
        .access-box input:focus { outline: none; border-color: #10b981; }
        .access-box input#code-input { text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
        .access-btn {
            width: 100%;
            background: #10b981;
            color: #052e1f;
            border: none;
            padding: 0.9rem 1rem;
            border-radius: 0.75rem;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
        }
        .access-btn:disabled { opacity: 0.6; }
        .access-error { color: #f87171; font-size: 0.85rem; margin-top: 0.75rem; min-height: 1.2em; }
    </style>
</head>
<body>

    <div id="loading-state">
        <div class="logo">📷</div>
        <div class="title">Escáner de Entradas</div>
        <div class="subtitle">VYT MUSIC · Acceso Staff</div>
        <div class="spinner"></div>
        <div class="msg">Conectando con la gala activa...</div>
        <div class="gala-name" id="gala-name"></div>
    </div>

    <div class="access-box" id="access-box">
        <div class="logo">🔑</div>
        <div class="title">Acceso Staff</div>
        <div class="subtitle" id="access-gala-name">VYT MUSIC</div>
        <form id="access-form">
            <input id="name-input" type="text" placeholder="Tu nombre" required autocomplete="off">
            <input id="code-input" type="text" placeholder="Código de acceso" required autocomplete="off">
            <button type="submit" class="access-btn" id="access-submit-btn">Ingresar</button>
            <div class="access-error" id="access-error"></div>
        </form>
    </div>

    <div class="error-box" id="error-box">
        <div class="error-icon">⏳</div>
        <div class="error-title">Sin gala activa</div>
        <div class="error-text">
            El organizador aún no habilitó el acceso para esta sesión.<br><br>
            Esperá que te avisen y volvé a entrar a este mismo link.
        </div>
        <button class="retry-btn" onclick="location.reload()">🔄 Reintentar</button>
    </div>

    <script type="module">
        import { auth, db } from './firebase_config.js';
        import { collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
        import { signInAnonymously } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';

        let activeEventId = null;
        let activeEventName = 'VYT MUSIC';

        async function entrar() {
            try {
                const snap = await getDocs(query(collection(db, 'events'), where('isActive', '==', true)));
                if (snap.empty) {
                    document.getElementById('loading-state').style.display = 'none';
                    document.getElementById('error-box').style.display = 'block';
                    return;
                }
                const gala = snap.docs[0];
                activeEventId = gala.id;
                activeEventName = gala.data().name || 'VYT MUSIC';

                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('access-gala-name').textContent = activeEventName;
                document.getElementById('access-box').style.display = 'block';
                document.getElementById('name-input').focus();
            } catch (e) {
                console.error(e);
                document.querySelector('.msg').textContent = '❌ Error de conexión. Revisá tu internet y reintentá.';
            }
        }

        // Valida el código contra los accesos que el organizador creó en
        // "Gestión de Asistentes" -- antes este link entraba DIRECTO al panel
        // de administración (gestion_asistentes.html) sin pedir nada, así que
        // cualquiera con el link podía generar/borrar códigos y entrar al
        // escáner sin validar nada. Ahora valida acá y recién después deja
        // pasar, con sesión anónima para que el asistente pueda además
        // generar entradas en la puerta (las reglas de Firestore exigen estar
        // autenticado para crear entradas, no solo para escanear).
        document.getElementById('access-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('access-error');
            const btn = document.getElementById('access-submit-btn');
            const name = document.getElementById('name-input').value.trim();
            const code = document.getElementById('code-input').value.trim().toUpperCase();

            errorEl.textContent = '';
            if (!name || !code) return;

            btn.disabled = true;
            btn.textContent = 'Verificando...';
            try {
                const codesCol = collection(db, `events/${activeEventId}/assistant_codes`);
                const q = query(codesCol, where('code', '==', code), where('active', '==', true));
                const snap = await getDocs(q);

                if (snap.empty) {
                    errorEl.textContent = '❌ Código incorrecto o desactivado. Pedile el código al organizador.';
                    btn.disabled = false;
                    btn.textContent = 'Ingresar';
                    return;
                }

                await signInAnonymously(auth);

                try {
                    localStorage.setItem('vyt_door_seller', JSON.stringify({ name, role: 'Staff' }));
                    localStorage.setItem('vyt_assistant_session', JSON.stringify({ name, code, eventId: activeEventId }));
                } catch (e2) {}

                window.location.replace(
                    `ingreso_evento.html?eventId=${activeEventId}&eventName=${encodeURIComponent(activeEventName)}&asistente=1`
                );
            } catch (error) {
                console.error(error);
                errorEl.textContent = '❌ Error de conexión. Revisá tu internet y reintentá.';
                btn.disabled = false;
                btn.textContent = 'Ingresar';
            }
        });

        entrar();
    </script>
</body>
</html>
