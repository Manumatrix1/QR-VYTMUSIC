<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Acceso Jurados - VYT MUSIC</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #fff;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
        .logo { font-size: 3.5rem; margin-bottom: 1rem; }
        .title { font-size: 1.6rem; font-weight: 900; color: #f59e0b; margin-bottom: 0.4rem; }
        .subtitle { color: #475569; font-size: 0.9rem; margin-bottom: 2.5rem; }
        .spinner {
            width: 52px; height: 52px;
            border: 4px solid rgba(245,158,11,0.2);
            border-top: 4px solid #f59e0b;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .msg { font-size: 1rem; color: #64748b; }
        .gala-name { color: #f59e0b; font-weight: 700; margin-top: 0.5rem; font-size: 1.1rem; }
        .error-box {
            background: #1e293b;
            border: 2px solid #ef4444;
            border-radius: 1rem;
            padding: 2rem;
            max-width: 380px;
            display: none;
        }
        .error-icon { font-size: 3rem; margin-bottom: 1rem; }
        .error-title { font-size: 1.2rem; font-weight: 700; color: #ef4444; margin-bottom: 0.75rem; }
        .error-text { color: #94a3b8; font-size: 0.9rem; line-height: 1.6; }
        .retry-btn {
            margin-top: 1.5rem;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 0.6rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }
        .retry-btn:active { opacity: 0.8; transform: scale(0.98); }
    </style>
</head>
<body>

    <div id="loading-state">
        <div class="logo">⚖️</div>
        <div class="title">Panel de Jurados</div>
        <div class="subtitle">VYT MUSIC · Certamen de Canto</div>
        <div class="spinner"></div>
        <div class="msg">Conectando con la gala activa...</div>
        <div class="gala-name" id="gala-name"></div>
    </div>

    <div class="error-box" id="error-box">
        <div class="error-icon">⏳</div>
        <div class="error-title">Sin gala activa</div>
        <div class="error-text">
            El organizador aún no habilitó el acceso para esta sesión.<br><br>
            Esperá que te avisen y volvé a entrar a este mismo link.
        </div>
        <button class="retry-btn" onclick="location.reload()">🔄 Reintentar</button>
    </div>

    <script type="module">
        import { db } from './firebase_config.js';
        import { collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        async function entrar() {
            try {
                const snap = await getDocs(query(collection(db, 'events'), where('isActive', '==', true)));
                if (snap.empty) {
                    document.getElementById('loading-state').style.display = 'none';
                    document.getElementById('error-box').style.display = 'block';
                    return;
                }
                const gala = snap.docs[0];
                const eventId = gala.id;
                const data = gala.data();
                const eventName = data.name || 'VYT MUSIC';
                const fecha = data.fecha || data.date || '';
                document.getElementById('gala-name').textContent = eventName;
                if (fecha) {
                    const fechaEl = document.createElement('div');
                    fechaEl.style.cssText = 'color:#94a3b8;font-size:0.9rem;margin-top:0.3rem;';
                    fechaEl.textContent = '📅 ' + fecha;
                    document.getElementById('gala-name').after(fechaEl);
                }
                window.location.replace(
                    `votacion_jurados_FINAL.html?eventId=${eventId}&eventName=${encodeURIComponent(eventName)}&fromPanel=panel_evento_SIMPLE`
                );
            } catch (e) {
                console.error(e);
                document.querySelector('.msg').textContent = '❌ Error de conexión. Revisá tu internet y reintentá.';
            }
        }

        entrar();
    </script>
</body>
</html>
