<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Pistas | VYT MUSIC</title>
    <meta name="description" content="Todas las pistas disponibles en VYT MUSIC, ordenadas por autor y por estilo.">
    <link rel="icon" href="imagenes/logo-vyt-music-320.png">
    <meta property="og:title" content="Catálogo de pistas | VYT MUSIC">
    <meta property="og:description" content="Todas las pistas disponibles, ordenadas por autor y por estilo.">
    <meta property="og:image" content="https://vyt-music.web.app/imagenes/logo-vyt-music-320.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { padding-bottom: 6rem; }
        .chip { padding: .35rem .8rem; border-radius: 9999px; font-size: .8rem; border: 1px solid #4b5563; background: #1f2937; color: #d1d5db; white-space: nowrap; }
        .chip.activo { background: #6366f1; border-color: #818cf8; color: #fff; font-weight: 700; }
        .tab { flex: 1; padding: .6rem; border-radius: .75rem; font-weight: 700; color: #9ca3af; }
        .tab.activo { background: #6366f1; color: #fff; }
        .letra { scroll-margin-top: 13rem; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-indigo-950 to-gray-900 min-h-screen text-white">
    <div class="max-w-3xl mx-auto px-4 py-6">
        <header class="text-center mb-5">
            <img src="imagenes/logo-vyt-music-320.png" alt="VYT-MUSIC" class="w-32 h-32 mx-auto rounded-3xl shadow-lg bg-white" onerror="this.style.display='none'">
            <h1 class="text-3xl font-black mt-3">🎵 Catálogo de pistas</h1>
            <p class="text-gray-300 text-sm mt-1">Pistas disponibles en <strong>VYT MUSIC</strong>. Buscá por autor o por estilo y pedí la que quieras por WhatsApp.</p>
            <p id="total" class="text-indigo-300 text-sm mt-2"></p>
        </header>

        <div class="bg-gray-800/90 border border-gray-700 rounded-xl p-3 mb-4 space-y-2 sticky top-0 z-20 backdrop-blur">
            <div class="flex gap-2 bg-gray-900 rounded-xl p-1">
                <button class="tab activo" data-vista="autor">👤 Por autor</button>
                <button class="tab" data-vista="estilo">🎶 Por estilo</button>
            </div>
            <input id="buscar" type="search" placeholder="🔍 Buscar canción o autor (ej: Arjona)..."
                class="w-full p-3 rounded-lg bg-gray-900 border border-gray-600 text-white focus:border-indigo-400 focus:outline-none">
            <div id="chips" class="flex gap-2 overflow-x-auto pb-1"></div>
        </div>

        <div id="estado" class="text-center text-gray-400 py-12">⏳ Cargando catálogo...</div>
        <div id="lista" class="space-y-3"></div>
    </div>

    <a id="btnComprar" target="_blank" rel="noopener"
       class="fixed bottom-4 inset-x-4 max-w-3xl mx-auto z-30 block text-center py-4 rounded-2xl bg-green-600 hover:bg-green-500 font-bold text-lg shadow-2xl">
        💬 Quiero comprar pistas
    </a>

    <script type="module">
        import { db } from './firebase_config.js';
        import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const WHATSAPP = '5493417444459';
        const $ = id => document.getElementById(id);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
        // Orden alfabético ignorando tildes y signos iniciales (¿, ¡, comillas)
        const cmp = (a, b) => norm(a).localeCompare(norm(b), 'es');
        const SIN_AUTOR = 'Otros artistas';
        const SIN_ESTILO = 'Otros estilos';
        const linkWA = texto => `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(texto)}`;

        let canciones = []; // { cancion, autor, estilo }
        let vista = 'autor';
        let estiloSel = '';

        $('btnComprar').href = linkWA('¡Hola! Vi el catálogo de pistas de VYT MUSIC y me interesa comprar: ');

        async function cargar() {
            try {
                const snap = await getDoc(doc(db, 'catalogo_publico', 'actual')).catch(e => {
                    console.warn('No se pudo leer el catálogo publicado:', e);
                    return null;
                });
                // Si todavía no se publicó desde el editor, se muestra la planilla inicial
                const entradas = snap?.exists()
                    ? (snap.data().entradas || {})
                    : await fetch('catalogo_inicial.json').then(r => r.json()).catch(() => ({}));
                const vistas = new Set();
                Object.values(entradas).forEach(v => {
                    if (v.oculto || !v.cancion) return;
                    const k = norm(v.cancion) + '|' + norm(v.autor);
                    if (vistas.has(k)) return;
                    vistas.add(k);
                    canciones.push({ cancion: v.cancion, autor: v.autor || '', estilo: v.estilo || '' });
                });
                $('estado').classList.add('hidden');
                $('total').textContent = `${canciones.length} pistas disponibles`;
                renderChips();
                render();
            } catch (e) {
                console.error(e);
                $('estado').textContent = '❌ No se pudo cargar el catálogo. Revisá tu conexión y recargá la página.';
            }
        }

        function renderChips() {
            const estilos = [...new Set(canciones.map(c => c.estilo).filter(Boolean))].sort(cmp);
            $('chips').innerHTML = [`<button class="chip ${!estiloSel ? 'activo' : ''}" data-estilo="">Todos</button>`]
                .concat(estilos.map(e => `<button class="chip ${estiloSel === e ? 'activo' : ''}" data-estilo="${esc(e)}">${esc(e)}</button>`)).join('');
        }

        function render() {
            const q = norm($('buscar').value);
            const lista = canciones.filter(c =>
                (!estiloSel || c.estilo === estiloSel) &&
                (!q || norm(`${c.cancion} ${c.autor} ${c.estilo}`).includes(q)));

            if (!lista.length) {
                $('lista').innerHTML = '<p class="text-center text-gray-400 py-10">No encontramos pistas con esa búsqueda.<br>Escribinos igual: ¡quizás la conseguimos!</p>';
                return;
            }

            const campo = vista === 'autor' ? 'autor' : 'estilo';
            const vacio = vista === 'autor' ? SIN_AUTOR : SIN_ESTILO;
            const grupos = new Map();
            lista.forEach(c => {
                const g = (c[campo] || '').trim() || vacio;
                if (!grupos.has(g)) grupos.set(g, []);
                grupos.get(g).push(c);
            });
            const nombres = [...grupos.keys()].sort((a, b) => (a === vacio) - (b === vacio) || cmp(a, b));

            $('lista').innerHTML = nombres.map(g => {
                const items = grupos.get(g).sort((a, b) => cmp(a.cancion, b.cancion));
                return `
                <section class="bg-gray-800/60 border border-gray-700 rounded-xl overflow-hidden">
                    <h2 class="px-4 py-2.5 bg-indigo-900/50 font-bold flex justify-between items-center">
                        <span>${vista === 'autor' ? '👤' : '🎶'} ${esc(g)}</span>
                        <span class="text-xs text-indigo-200 font-normal">${items.length} pista${items.length !== 1 ? 's' : ''}</span>
                    </h2>
                    <ul class="divide-y divide-gray-700/70">
                        ${items.map(c => {
                            const detalle = vista === 'autor' ? c.estilo : c.autor;
                            const pedido = `¡Hola! Vi el catálogo de VYT MUSIC y me interesa la pista "${c.cancion}"${c.autor ? ` (${c.autor})` : ''}.`;
                            return `
                            <li class="flex items-center gap-3 px-4 py-2.5">
                                <div class="flex-1 min-w-0">
                                    <p class="font-semibold truncate">${esc(c.cancion)}</p>
                                    ${detalle ? `<p class="text-xs text-gray-400 truncate">${esc(detalle)}</p>` : ''}
                                </div>
                                <a href="${linkWA(pedido)}" target="_blank" rel="noopener"
                                   class="flex-shrink-0 text-xs font-bold px-3 py-1.5 rounded-full bg-green-700 hover:bg-green-600">Pedir</a>
                            </li>`;
                        }).join('')}
                    </ul>
                </section>`;
            }).join('');
        }

        document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
            vista = t.dataset.vista;
            document.querySelectorAll('.tab').forEach(x => x.classList.toggle('activo', x === t));
            render();
        }));
        $('chips').addEventListener('click', e => {
            const b = e.target.closest('[data-estilo]');
            if (!b) return;
            estiloSel = b.dataset.estilo;
            renderChips();
            render();
        });
        $('buscar').addEventListener('input', render);
        cargar();
    </script>
</body>
</html>
